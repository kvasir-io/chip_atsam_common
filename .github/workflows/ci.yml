name: CI

# The host tests of the clock solver and of the NVM error decoding (tests/CMakeLists.txt): most checks are static_asserts, so building is the test,
# and the must_fail_* tests compile must_fail.cpp and look for the error message. They run on the test limits in
# tests/TestLimits.hpp and need only Kvasir_SDK's Util/Prescaler.hpp, which they fetch. The chips' real
# limits are tested in each chip package's own CI, against the chip_atsam_common commit it records.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-host-tests.yml@master
        with: {sanitizers: true}

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master
